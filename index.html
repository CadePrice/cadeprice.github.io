<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cade Price - Engineering Portfolio | RF, Embedded Systems, Hardware, and Verification & Validation">
  <title>Cade Price | Engineering Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/landing.css">
</head>
<body>
  <!-- Video Background -->
  <div class="background-container video-background-section">
    <video autoplay muted loop playsinline class="background-video" id="bgVideo">
      <source src="assets/videos/background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Header Navigation -->
  <header class="site-header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="brand-link">
          <div class="brand-icon-small">
            <span class="gradient-text">CP</span>
          </div>
          <span class="brand-text">Cade Price</span>
        </a>

        <nav class="header-nav" aria-label="Main navigation">
          <a href="projects.html">Projects</a>
          <a href="resume.html">Resume</a>
          <a href="contact.html">Contact</a>
          <a href="games/index.html">Game</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Landing Section -->
  <main class="landing-main snap-section">
    <div class="container">
      <div class="landing-content">

        <!-- Brand Section -->
        <div class="brand-section">
          <h1 class="brand-name">Cade Price</h1>
        </div>

        <!-- Navigation -->
        <nav class="main-nav" aria-label="Main navigation">
          <a href="projects.html" class="nav-icon" aria-label="View Projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            <span class="nav-label">Projects</span>
          </a>

          <a href="contact.html" class="nav-icon" aria-label="Contact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span class="nav-label">Contact</span>
          </a>

          <a href="#" class="nav-icon" aria-label="View Resume" id="resumeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span class="nav-label">Resume</span>
          </a>

          <a href="games/index.html" class="nav-icon" aria-label="Play Game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="11" x2="10" y2="11"></line>
              <line x1="8" y1="9" x2="8" y2="13"></line>
              <line x1="15" y1="12" x2="15.01" y2="12"></line>
              <line x1="18" y1="10" x2="18.01" y2="10"></line>
              <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            </svg>
            <span class="nav-label">Game</span>
          </a>
        </nav>

      </div>
    </div>
  </main>

  <!-- Second Section (Blank Card) -->
  <section class="secondary-section snap-section">
    <div class="container">
      <div class="blank-card">
        <!-- Content can be added here in the future -->
      </div>
    </div>
  </section>

  <!-- Resume Modal -->
  <div id="resumeModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Resume</h2>
        <div class="modal-actions">
          <a href="assets/documents/resume.pdf" download class="btn-download" aria-label="Download Resume">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </a>
          <button class="modal-close" id="closeModal" aria-label="Close Modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <iframe
          src="assets/documents/resume.pdf"
          type="application/pdf"
          class="modal-pdf-viewer"
          title="Resume PDF"
        >
          <p>Your browser does not support PDF viewing.
            <a href="assets/documents/resume.pdf" download>Download the PDF</a> instead.
          </p>
        </iframe>
      </div>
    </div>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
